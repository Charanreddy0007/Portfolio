name: Update Portfolio JSON

on:
  workflow_dispatch:

  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout Portfolio repository
      # ---------------------------------------------------------
      - name: Checkout Portfolio repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Set up Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f python-script/requirements.txt ]; then
            pip install -r python-script/requirements.txt
          fi

      # ---------------------------------------------------------
      # Run Python Script
      # Uses Token 1: TOKENGITHUB
      # ---------------------------------------------------------
      - name: Run Python Script
        env:
          TOKENGITHUB: ${{ secrets.TOKENGITHUB }}
        run: |
          python python-script/main.py

      # ---------------------------------------------------------
      # Commit changes to Portfolio repository
      # ---------------------------------------------------------
      - name: Commit updated Portfolio JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No Portfolio changes detected."
          else
            git commit -m "Auto-update portfolio JSON"
            git push origin main
          fi

      # ---------------------------------------------------------
      # Checkout Profile README repository
      # Uses Token 2: PROFILE_REPO_TOKEN
      # ---------------------------------------------------------
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          repository: Charanreddy0007/Charanreddy0007
          token: ${{ secrets.PROFILE_REPO_TOKEN }}
          path: second-repo

      # ---------------------------------------------------------
      # Copy ONLY leetcodeResponse.json
      # ---------------------------------------------------------
      - name: Copy leetcodeResponse.json
        run: |
          cp data/leetcodeResponse.json \
             second-repo/data/leetcodeResponse.json

      # ---------------------------------------------------------
      # Commit ONLY leetcodeResponse.json
      # ---------------------------------------------------------
      - name: Commit leetcodeResponse.json to profile repository
        working-directory: second-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/leetcodeResponse.json

          if git diff --cached --quiet; then
            echo "No leetcodeResponse.json changes detected."
          else
            git commit -m "Auto-update leetcodeResponse.json"
            git push origin main
          fi