name: Update Portfolio JSON

on:
  workflow_dispatch:

  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Portfolio repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f python-script/requirements.txt ]; then
            pip install -r python-script/requirements.txt
          fi

      - name: Run Python Script
        env:
          TOKENGITHUB: ${{ secrets.TOKENGITHUB }}
        run: |
          python python-script/main.py

      # ---------------------------------------------------------
      # Commit changes to Portfolio repository
      # ---------------------------------------------------------
      - name: Commit updated Portfolio JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No Portfolio changes detected."
          else
            git commit -m "Auto-update portfolio JSON"
            git push
          fi

      # ---------------------------------------------------------
      # Update leetcodeResponse.json in second repository
      # ---------------------------------------------------------
      - name: Checkout second repository
        if: success()
        uses: actions/checkout@v4
        with:
          repository: Charanreddy0007/Charanreddy0007
          token: ${{ secrets.TOKENGITHUB }}
          path: second-repo

      - name: Copy leetcodeResponse.json to second repository
        run: |
          cp data/leetcodeResponse.json second-repo/data/leetcodeResponse.json

      - name: Commit leetcodeResponse.json to second repository
        working-directory: second-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/leetcodeResponse.json

          if git diff --cached --quiet; then
            echo "No leetcodeResponse.json changes detected."
          else
            git commit -m "Auto-update leetcodeResponse.json"
            git push
          fi